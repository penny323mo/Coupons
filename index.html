    <!-- Remove any service worker left over from the old PWA build -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var killed = false;
          regs.forEach(function (r) { r.unregister(); killed = true; });
          if ('caches' in window) {
            caches.keys().then(function (names) { names.forEach(function (n) { caches.delete(n); }); });
          }
          if (killed && !sessionStorage.getItem('sw_nuked')) {
            sessionStorage.setItem('sw_nuked', '1');
            location.reload();
          }
        });
      }
